name: CI/CD Pipeline

# Trigger khi push len nhanh main hoac ThangTester
on:
  push:
    branches:
      - "main"
      - "ThangTester"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Setup JDK 21 (du an dung Java 21 theo Dockerfile nhom)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # 3. Build backend JAR bang Gradle
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle (skip tests)
        run: ./gradlew bootJar -x test --no-daemon

      # 4. Login Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Build & Push Backend image
      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bton-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/bton-backend:${{ github.sha }}

      # 6. Build & Push Frontend image
      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bton-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/bton-frontend:${{ github.sha }}

      # 7. Deploy len VPS 221.121.4.137 qua SSH
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd ~/devops-exam

            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/bton-backend:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/bton-frontend:latest

            docker compose down backend frontend
            BACKEND_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/bton-backend:latest \
            FRONTEND_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/bton-frontend:latest \
              docker compose up -d

            docker ps
            echo "Deploy thanh cong len VPS 221.121.4.137!"
