# Tác giả: Trần Hữu Nhật (Backend & DevOps Lead)
# ============================================================
# CD Pipeline — BTON Deploy to Production
# Trigger: after CI workflow completes successfully on main
# Steps: pull latest images → docker compose up → health check
# Requires GitHub Secrets:
#   DEPLOY_HOST    — SSH host of production server
#   DEPLOY_USER    — SSH username
#   DEPLOY_SSH_KEY — private SSH key (RSA / Ed25519)
#   DEPLOY_PATH    — absolute path on server, e.g. /opt/bton
# ============================================================

name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            echo "==> Pulling latest images..."
            docker compose pull backend frontend

            echo "==> Restarting services (zero-downtime rolling)..."
            docker compose up -d --no-deps --wait backend
            docker compose up -d --no-deps --wait frontend

            echo "==> Removing dangling images..."
            docker image prune -f

            echo "==> Deployment complete."
            docker compose ps
