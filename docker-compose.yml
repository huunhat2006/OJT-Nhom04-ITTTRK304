# Tác giả: Trần Hữu Nhật (Backend & DevOps Lead)
# ============================================================
# Docker Compose — BTON Personal Finance Management System
# Services: mysql · backend · frontend
# Usage:
#   cp .env.example .env        # fill in secrets
#   docker compose up -d        # start all services
#   docker compose logs -f      # follow logs
#   docker compose down -v      # stop + remove volumes
# ============================================================

name: bton

services:

  # ── MySQL 8 ────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: bton-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bton_db}
      MYSQL_USER: ${MYSQL_USER:-bton}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # NOTE: schema + seed data are owned by Flyway (src/main/resources/db/migration).
      # Do NOT mount a MySQL init script here — running two seed sources caused
      # duplicated/conflicting demo data. The backend creates the schema on startup.
      - ./scripts/backup:/backup          # mount backup directory
    networks:
      - bton-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+07:00
      --log-bin-trust-function-creators=1

  # ── Backend (Spring Boot) ───────────────────────────────────
  backend:
    image: ${DOCKER_USERNAME:-huunhat2006}/bton-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: bton-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: Asia/Ho_Chi_Minh
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-bton_db}?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-bton}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-dummy-google-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-dummy-google-client-secret}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - bton-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ── Frontend (React + Nginx) ────────────────────────────────
  frontend:
    image: ${DOCKER_USERNAME:-huunhat2006}/bton-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
    container_name: bton-frontend
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - bton-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

# ── Networks ─────────────────────────────────────────────────
networks:
  bton-net:
    driver: bridge

# ── Volumes ──────────────────────────────────────────────────
volumes:
  mysql_data:
    driver: local
