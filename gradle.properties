# Gradle JVM settings — tối ưu cho Docker build (CI/CD)
# Tác giả: Trần Hữu Nhật (Backend & DevOps Lead)

# Heap tối đa 512MB — đủ để compile Spring Boot project lớn mà không OOM
org.gradle.jvmargs=-Xms256m -Xmx512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Tắt Gradle daemon trong môi trường CI (Docker dùng --no-daemon rồi, đây là fallback)
org.gradle.daemon=false

# Parallel build — tăng tốc trên môi trường multi-core
org.gradle.parallel=true

# Tắt configuration cache warnings
org.gradle.warning.mode=all
