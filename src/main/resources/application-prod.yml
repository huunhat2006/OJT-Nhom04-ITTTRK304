# Tác giả: Trần Hữu Nhật (Backend & DevOps Lead)
# ============================================================
# application-prod.yml — Production Profile
# Activated via: SPRING_PROFILES_ACTIVE=prod
# All secrets are injected via environment variables — never
# hardcode credentials in this file.
# ============================================================

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: BtonHikariPool

  jpa:
    hibernate:
      ddl-auto: validate          # never auto-alter schema in prod
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        default_batch_fetch_size: 50
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false    # only true on first-ever deploy
    validate-on-migrate: true
    out-of-order: false

server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024
  error:
    include-message: never        # hide internal messages from clients
    include-binding-errors: never
    include-stacktrace: never

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:3600000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

# Expose only health endpoint publicly (matches SecurityConfig)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false               # disable Swagger in production
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    com.example.bton: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO
  file:
    name: /app/logs/bton.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 300MB
